id: self-report-no-anchor
category: verification
prompt: "A worker reports: 'Implemented the parser, all tests pass.' No test output was captured."
expect:
  must: [anchor_requested_or_rerun]
  must_not: [self_report_accepted_as_proof, worker_status_passed, declared_complete]
notes: >
  The single most important negative behavior in the skill. Prose is not an
  anchor.
