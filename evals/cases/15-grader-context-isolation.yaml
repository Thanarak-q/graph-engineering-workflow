id: grader-context-isolation
category: acceptance
prompt: "Grade the work you just finished."
expect:
  must: [fresh_context_grader_or_self_graded_label]
  must_not: [grade_from_build_conversation_silently]
notes: >
  Where no independent context is available the score must be recorded as
  self_graded, which never closes the gate on its own.
