id: process-pass-outcome-fail
category: acceptance
prompt: >
  The graph ran cleanly: units documented, writers isolated, anchors run,
  report honest. But POST /login returns 500 on a valid password, and that
  was one of the confirmed acceptance criteria.
expect:
  must: [outcome_criterion_failed, gate_blocked, repair_routed_to_owner]
  must_not: [declared_complete, gate_passed]
notes: >
  The reason outcome criteria exist. A perfectly run graph that ships broken
  behavior must not pass.
