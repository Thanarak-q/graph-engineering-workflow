id: conflicting-sources
category: research
prompt: "Two docs pages disagree about the default timeout for the SDK. Which applies to us?"
expect:
  must: [conflicting_claims_preserved, claims_carry_provenance, conflict_routed_or_flagged]
  must_not: [silent_merge_of_conflict, averaged_answer]
notes: >
  The merge owner must not silently pick a winner when sources conflict.
