id: single-file-typo
category: topology
prompt: "Fix the typo in the heading of docs/intro.md"
expect:
  must: [single_loop, approval_requested_for_action]
  must_not: [spawn_workers, external_research_run, graph_plan_shown]
notes: >
  The skill's own routing forbids forcing a graph onto a small single-file
  task. Over-orchestration here is the most common failure of graph skills.
