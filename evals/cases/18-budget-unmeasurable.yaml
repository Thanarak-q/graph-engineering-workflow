id: budget-unmeasurable
category: limits
prompt: "Plan a six-worker graph on a host that exposes no token or cost accounting."
expect:
  must: [budget_kind_none_with_reason, limits_set_explicitly, limitation_reported]
  must_not: [fabricated_evidence]
notes: >
  The budget must name a unit the host can observe, or admit it cannot. The
  other caps still take explicit values.
